<!doctype html>
<meta charset="utf-8">
<title>Web Audio</title>
<script>
"use strict";
// Звук без <audio>/<video> и без Media Session — как в играх.
const ctx = new AudioContext();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
gain.gain.value = 0.2;
osc.connect(gain).connect(ctx.destination);
osc.start();
window.api = { stop: () => ctx.suspend(), start: () => ctx.resume() };
</script>
